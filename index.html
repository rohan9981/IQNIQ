<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IGNIQ — Interactive Business Model &amp; Valuation Engine v3.0</title>
<style>
:root{
  --navy:#0A1628; --navy2:#101F36; --navy3:#16294a; --line:#22395e;
  --txt:#E8EEF7; --mut:#90A4C4; --acc:#39D3A0; --acc2:#5BA8FF;
  --rev:#2FA37A; --cost:#D9A441; --pro:#5BA8FF; --neg:#FF6B6B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--txt);font:14px/1.45 "Segoe UI",Inter,system-ui,sans-serif}
header{background:linear-gradient(90deg,#0A1628,#16294a);padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{font-size:17px;margin:0;letter-spacing:.4px}
header .tag{color:var(--mut);font-size:12px}
.badge{background:#15372c;color:var(--acc);border:1px solid #1f5c48;padding:3px 9px;border-radius:20px;font-size:11px}
.wrap{display:flex;align-items:flex-start}
aside{width:320px;min-width:320px;background:var(--navy2);border-right:1px solid var(--line);height:calc(100vh - 56px);overflow-y:auto;position:sticky;top:56px;padding-bottom:40px}
main{flex:1;min-width:0;padding:16px 20px 60px}
.grp{border-bottom:1px solid var(--line)}
.grp>h3{margin:0;padding:11px 14px;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--acc);cursor:pointer;display:flex;justify-content:space-between}
.grp>div{padding:4px 14px 14px;display:none}
.grp.open>div{display:block}
.fld{margin:9px 0}
.fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:3px}
.fld label b{color:var(--txt);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc);height:16px}
input[type=number],select{width:100%;background:var(--navy3);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:5px 7px;font-size:13px}
input.cell{width:84px;text-align:right;padding:3px 5px;font-size:12.5px}
input.cell:focus,input[type=number]:focus{outline:1px solid var(--acc);border-color:var(--acc)}
.btn{background:var(--navy3);border:1px solid var(--line);color:var(--txt);padding:7px 11px;border-radius:6px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.on{background:var(--acc);color:#04291e;border-color:var(--acc);font-weight:600}
.row{display:flex;gap:7px;flex-wrap:wrap}
nav.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:9px}
nav.tabs button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px}
nav.tabs button:hover{color:var(--txt);background:var(--navy2)}
nav.tabs button.on{background:var(--navy3);color:var(--acc);border-color:var(--line);font-weight:600}
section{display:none} section.on{display:block}
h2{font-size:15px;margin:20px 0 9px;color:var(--acc2);letter-spacing:.3px}
h2:first-child{margin-top:0}
p.note{color:var(--mut);font-size:12.3px;margin:5px 0 12px;max-width:900px}
table{border-collapse:collapse;width:100%;margin-bottom:8px;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:230px}
thead th{background:var(--navy);color:#fff;font-weight:600;position:sticky;top:56px;z-index:5}
tr.sec td{background:#0d1d33;color:var(--acc);font-weight:600;letter-spacing:.6px;font-size:11.5px;text-transform:uppercase}
tr.rev td{background:rgba(47,163,122,.10)} tr.cost td{background:rgba(217,164,65,.10)}
tr.pro td{background:rgba(91,168,255,.13);font-weight:600}
tr.tot td{background:#13263f;font-weight:700}
td.neg{color:var(--neg)} td.pos{color:var(--acc)}
.tw{overflow-x:auto;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px;margin-bottom:16px}
.kpi{background:var(--navy2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:11px 13px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:21px;font-weight:700;margin:3px 0 1px}
.kpi .s{font-size:11.5px;color:var(--mut)}
.kpi.b{border-left-color:var(--acc2)} .kpi.w{border-left-color:var(--cost)} .kpi.r{border-left-color:var(--neg)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.card h4{margin:0 0 8px;font-size:13px;color:var(--acc2);font-weight:600}
svg{display:block;width:100%;height:auto}
.lg{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:6px}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px}
.hm td{text-align:center;min-width:72px;font-size:12px;border-color:#0A1628}
.hm td:first-child{text-align:right;min-width:90px;background:var(--navy2);font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.p-live{background:#15372c;color:var(--acc)} .p-dash{background:#2a2033;color:#b89ce0} .p-no{background:#2b1b1b;color:#e08b8b}
.warn{background:#2a2112;border:1px solid #5c4620;color:#F0C674;padding:10px 13px;border-radius:8px;font-size:12.8px;margin-bottom:12px}
.ok{background:#12291f;border:1px solid #1f5c48;color:var(--acc);padding:10px 13px;border-radius:8px;font-size:12.8px;margin-bottom:12px}
.foot{color:var(--mut);font-size:11.5px;margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:980px){.wrap{flex-direction:column}aside{width:100%;min-width:0;height:auto;position:static}thead th{top:0}}
</style>
</head>
<body>
<header>
  <h1>IGNIQ <span style="color:var(--mut);font-weight:400">— Interactive Business Model &amp; Valuation Engine</span></h1>
  <span class="tag">FY2027-28 → FY2031-32 · v3.0 live model</span>
  <span class="badge" id="scenBadge">BASE CASE</span>
  <span style="flex:1"></span>
  <button class="btn" onclick="exportCSV()">⬇ Export CSV</button>
  <button class="btn" onclick="window.print()">🖨 Print / PDF</button>
  <button class="btn" onclick="resetAll()">↺ Reset</button>
</header>

<div class="wrap">
<aside id="sidebar"></aside>
<main>
  <nav class="tabs" id="tabs"></nav>
  <section id="t-dash" class="on"></section>
  <section id="t-growth"></section>
  <section id="t-price"></section>
  <section id="t-rev"></section>
  <section id="t-cost"></section>
  <section id="t-pl"></section>
  <section id="t-ue"></section>
  <section id="t-val"></section>
  <section id="t-scen"></section>
  <section id="t-sens"></section>
  <section id="t-road"></section>
  <section id="t-audit"></section>
  <div class="foot">All figures are planning hypotheses, not forecasts. Replace inputs with signed contracts and quoted costs before investor circulation. This tool is not financial, tax or legal advice.</div>
</main>
</div>

<script>
/* ============================================================
   1. STATE — every driver is editable
   ============================================================ */
const YL=['FY27-28','FY28-29','FY29-30','FY30-31','FY31-32'];
const L=1e5; // 1 lakh

const DEF={
 // growth
 newInst:[10,20,30,45,60], churn:10,
 spi:[2000,2000,2200,2400,2600], fpi:[50,50,55,60,65],
 bulkShare:20, bulkDisc:20, pilotDisc:10,
 // pricing
 sPrice:[1000,1000,1100,1200,1300],
 rPrice:[0,100,100,120,120], rAdopt:[0,30,35,40,45],
 fPrice:[1500,1500,1600,1700,1800],
 cPrice:[0,3000,3000,3500,3500], cAdopt:[0,60,65,70,75],
 vPrice:[0,5000,5000,6000,6000], vShare:[0,50,60,65,70], vDocs:[0,3,4,5,6],
 mPrice:[0,0,800,900,1000], mAdopt:[0,0,40,50,55],
 eFee:[0,0,150000,200000,250000], ePart:[0,0,5,15,30],
 // costs (INR lakhs)
 salLead:[18,20,64,76,90], salTech:[83.52,117.52,132,152,174],
 salPsy:[18,29,36,42,48], salCont:[6.4,34.4,40,38,44],
 salSales:[10.4,34.4,52,74,84], salOps:[6,16,28,34,40], salHEI:[6,16,20,12,14],
 head:[14,24,36,46,56],
 opTechFix:[11,17,25,34,46], opRnd:[13,13,11,11,12], opMkt:[14,27,43,63,88],
 opOffice:[7.5,11,17,22,27], opLegal:[6,6,7,7,8],
 cloudPerStudent:20, contingency:5, salMult:100, opexMult:100,
 // unit econ
 cogsS:[180,140,110,90,75], cogsF:[300,400,350,300,250],
 // finance
 tax:25, carryFwd:1, seed:400, grant:[17.15,17.15,0,0,0],
 capex:[10,5,3,3,5], oneTime:[8,4,2,1,1], ramp:0.6, daPct:5,
 // valuation
 mult:10, seedPre:1200, aAmt:2500, aPre:8000, bAmt:10000, bPre:45000, esop:10,
 exitMultLo:8, exitMultHi:10
};
let S=JSON.parse(JSON.stringify(DEF));
let SCEN='base';
const SCEN_DEF={
 cons:{inst:.70,spi:.90,price:.95,adopt:.80,cost:.95},
 base:{inst:1,spi:1,price:1,adopt:1,cost:1},
 aggr:{inst:1.50,spi:1.10,price:1.00,adopt:1.15,cost:1.15}
};

/* ============================================================
   2. ENGINE — pure function, no DOM
   ============================================================ */
function compute(s,mod){
 const m=Object.assign({inst:1,spi:1,price:1,adopt:1,cost:1},mod||{});
 const n=5, cap=x=>Math.max(0,Math.min(1,x));
 const R={newI:[],churned:[],inst:[],stu:[],fac:[]};
 let prev=0;
 for(let i=0;i<n;i++){
   R.newI[i]=s.newInst[i]*m.inst;
   R.churned[i]=prev*s.churn/100;
   R.inst[i]=prev+R.newI[i]-R.churned[i]; if(R.inst[i]<0)R.inst[i]=0;
   prev=R.inst[i];
   R.stu[i]=R.inst[i]*s.spi[i]*m.spi;
   R.fac[i]=R.inst[i]*s.fpi[i];
 }
 const bs=s.bulkShare/100, bd=s.bulkDisc/100;
 R.stuStd=[];R.stuDis=[];R.facStd=[];R.facDis=[];
 R.serenStd=[];R.serenDis=[];R.pilotS=[];R.seren=[];R.resume=[];R.resumeN=[];
 R.prismStd=[];R.prismDis=[];R.pilotF=[];R.prism=[];R.cert=[];R.certN=[];
 R.vElig=[];R.vDocsT=[];R.vista=[];R.merPay=[];R.mer=[];R.emp=[];R.rev=[];
 for(let i=0;i<n;i++){
   const p=s.sPrice[i]*m.price, f=s.fPrice[i]*m.price;
   R.stuStd[i]=R.stu[i]*(1-bs); R.stuDis[i]=R.stu[i]*bs;
   R.facStd[i]=R.fac[i]*(1-bs); R.facDis[i]=R.fac[i]*bs;
   R.serenStd[i]=R.stuStd[i]*p/L; R.serenDis[i]=R.stuDis[i]*p*(1-bd)/L;
   R.pilotS[i]= i===0 ? (R.serenStd[i]+R.serenDis[i])*s.pilotDisc/100 : 0;
   R.seren[i]=R.serenStd[i]+R.serenDis[i]-R.pilotS[i];
   R.resumeN[i]=R.stu[i]*cap(s.rAdopt[i]/100*m.adopt);
   R.resume[i]=R.resumeN[i]*s.rPrice[i]*m.price/L;
   R.prismStd[i]=R.facStd[i]*f/L; R.prismDis[i]=R.facDis[i]*f*(1-bd)/L;
   R.pilotF[i]= i===0 ? (R.prismStd[i]+R.prismDis[i])*s.pilotDisc/100 : 0;
   R.prism[i]=R.prismStd[i]+R.prismDis[i]-R.pilotF[i];
   R.certN[i]=R.fac[i]*cap(s.cAdopt[i]/100*m.adopt);
   R.cert[i]=R.certN[i]*s.cPrice[i]*m.price/L;
   R.vElig[i]=R.inst[i]*cap(s.vShare[i]/100*m.adopt);
   R.vDocsT[i]=R.vElig[i]*s.vDocs[i];
   R.vista[i]=R.vDocsT[i]*s.vPrice[i]*m.price/L;
   R.merPay[i]=R.stu[i]*cap(s.mAdopt[i]/100*m.adopt);
   R.mer[i]=R.merPay[i]*s.mPrice[i]*m.price/L;
   R.emp[i]=s.ePart[i]*s.eFee[i]*m.price/L;
   R.rev[i]=R.seren[i]+R.resume[i]+R.prism[i]+R.cert[i]+R.vista[i]+R.mer[i]+R.emp[i];
 }
 // costs
 const sm=s.salMult/100*m.cost, om=s.opexMult/100*m.cost;
 R.sal={};['Lead','Tech','Psy','Cont','Sales','Ops','HEI'].forEach(k=>{
   R.sal[k]=s['sal'+k].map(v=>v*sm);
 });
 R.salTot=[];R.cloud=[];R.techInfra=[];R.nonSalBase=[];R.cont=[];R.nonSal=[];R.cost=[];
 for(let i=0;i<n;i++){
   R.salTot[i]=Object.keys(R.sal).reduce((a,k)=>a+R.sal[k][i],0);
   R.cloud[i]=R.stu[i]*s.cloudPerStudent/L*om;
   R.techInfra[i]=s.opTechFix[i]*om+R.cloud[i];
   R.nonSalBase[i]=R.techInfra[i]+(s.opRnd[i]+s.opMkt[i]+s.opOffice[i]+s.opLegal[i])*om;
   R.cont[i]=R.nonSalBase[i]*s.contingency/100;
   R.nonSal[i]=R.nonSalBase[i]+R.cont[i];
   R.cost[i]=R.salTot[i]+R.nonSal[i];
 }
 // P&L
 R.ebitda=[];R.ebitdaM=[];R.da=[];R.ebit=[];R.taxv=[];R.pat=[];
 let carry=0;
 for(let i=0;i<n;i++){
   R.ebitda[i]=R.rev[i]-R.cost[i];
   R.ebitdaM[i]=R.rev[i]>0?R.ebitda[i]/R.rev[i]*100:0;
   R.da[i]=R.techInfra[i]*s.daPct/100;
   R.ebit[i]=R.ebitda[i]-R.da[i];
   let tb=R.ebit[i];
   if(s.carryFwd){ if(tb<0){carry+=-tb;tb=0;} else {const u=Math.min(carry,tb);tb-=u;carry-=u;} }
   R.taxv[i]= tb>0 ? tb*s.tax/100 : 0;
   R.pat[i]=R.ebit[i]-R.taxv[i];
 }
 // cash
 R.open=[];R.close=[];
 let c=s.seed;
 for(let i=0;i<n;i++){
   R.open[i]=c;
   c=c+R.rev[i]-R.cost[i]-R.taxv[i]-s.capex[i]-s.oneTime[i]+s.grant[i];
   R.close[i]=c;
 }
 // monthly engine
 R.months=[];let bal=s.seed,beOp=null,beCash=null,minBal=s.seed,minM=0,cumOp=0;
 for(let y=0;y<n;y++){
   for(let k=1;k<=12;k++){
     const w=1+s.ramp*((2*(k-.5)/12)-1);
     const mr=R.rev[y]*w/12, mc=(R.cost[y]+R.taxv[y]+s.capex[y]+s.oneTime[y])/12, mg=s.grant[y]/12;
     const net=mr-mc+mg; bal+=net; cumOp+=mr-mc;
     const idx=y*12+k;
     if(beOp===null && mr>=(R.cost[y]/12)) beOp=idx;
     if(beCash===null && cumOp>=0) beCash=idx;
     if(bal<minBal){minBal=bal;minM=idx;}
     R.months.push({i:idx,y:y,rev:mr,cost:mc,net:net,bal:bal});
   }
 }
 R.beOp=beOp;R.beCash=beCash;R.minBal=minBal;R.minM=minM;
 R.burn=R.months.filter(x=>x.net<0).map(x=>-x.net);
 R.peakBurn=R.burn.length?Math.max(...R.burn):0;
 R.runway= R.minBal>0 ? 'Never runs dry' : 'Cash gap';
 R.peakNeed= R.minBal<0 ? -R.minBal : 0;
 // unit economics
 R.arpuS=[];R.arpuF=[];R.gmS=[];R.gmF=[];R.acv=[];R.cac=[];R.gmBlend=[];R.ltv=[];R.lcac=[];R.pay=[];
 for(let i=0;i<n;i++){
   R.arpuS[i]=R.stu[i]?(R.seren[i]+R.resume[i]+R.mer[i])*L/R.stu[i]:0;
   R.arpuF[i]=R.fac[i]?(R.prism[i]+R.cert[i])*L/R.fac[i]:0;
   R.gmS[i]=R.arpuS[i]?(R.arpuS[i]-s.cogsS[i])/R.arpuS[i]*100:0;
   R.gmF[i]=R.arpuF[i]?(R.arpuF[i]-s.cogsF[i])/R.arpuF[i]*100:0;
   const cogs=(s.cogsS[i]*R.stu[i]+s.cogsF[i]*R.fac[i])/L;
   R.gmBlend[i]=R.rev[i]?(R.rev[i]-cogs)/R.rev[i]:0;
   R.acv[i]=R.inst[i]?R.rev[i]*L/R.inst[i]:0;
   R.cac[i]=R.newI[i]?(R.sal.Sales[i]+s.opMkt[i]*om)*L/R.newI[i]:0;
   let sum=0,rr=1;for(let t=0;t<5;t++){sum+=rr;rr*=(1-s.churn/100);}
   R.ltv[i]=R.acv[i]*R.gmBlend[i]*sum;
   R.lcac[i]=R.cac[i]?R.ltv[i]/R.cac[i]:0;
   R.pay[i]=(R.acv[i]*R.gmBlend[i])>0?R.cac[i]/(R.acv[i]*R.gmBlend[i]/12):0;
 }
 R.cagr = R.rev[0]>0 ? (Math.pow(R.rev[4]/R.rev[0],1/4)-1)*100 : 0;
 R.nrr=[];
 for(let i=1;i<n;i++){
   const base=R.inst[i-1]*(1-s.churn/100);
   R.nrr[i]= R.rev[i-1]>0 ? (base*R.acv[i]/L)/R.rev[i-1]*100 : 0;
 }
 return R;
}

/* ============================================================
   3. FORMATTERS
   ============================================================ */
const nf=(v,d=2)=>(v==null||isNaN(v))?'—':Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const ni=v=>(v==null||isNaN(v))?'—':Math.round(v).toLocaleString('en-IN');
const cr=v=>nf(v/100,2);
const rs=v=>'₹'+ni(v);
const pc=(v,d=1)=>(v==null||isNaN(v))?'—':nf(v,d)+'%';
const mon=i=>i==null?'Not reached':'Month '+i+' ('+YL[Math.floor((i-1)/12)]+' Q'+(Math.floor(((i-1)%12)/3)+1)+')';

/* ============================================================
   4. SIDEBAR
   ============================================================ */
function sld(k,lab,min,max,step,suf){
 return `<div class="fld"><label>${lab}<b id="lb_${k}">${S[k]}${suf||''}</b></label>
 <input type="range" min="${min}" max="${max}" step="${step}" value="${S[k]}" data-k="${k}" data-sl="1"></div>`;
}
function num(k,lab){return `<div class="fld"><label>${lab}</label><input type="number" value="${S[k]}" data-k="${k}"></div>`;}

function buildSidebar(){
 document.getElementById('sidebar').innerHTML=`
 <div class="grp open"><h3>Scenario <span>▾</span></h3><div>
   <div class="row" style="margin-bottom:8px">
     <button class="btn" data-sc="cons">Conservative</button>
     <button class="btn on" data-sc="base">Base</button>
     <button class="btn" data-sc="aggr">Aggressive</button>
   </div>
   <p style="color:var(--mut);font-size:11.5px;margin:0">Scenarios are multipliers on the same engine, so any edit you make flows through all three.</p>
 </div></div>

 <div class="grp open"><h3>Growth engine <span>▾</span></h3><div>
   ${sld('churn','Annual institute churn',0,30,1,'%')}
   ${sld('bulkShare','Students in &gt;3000 institutes',0,60,5,'%')}
   ${sld('bulkDisc','Bulk discount',0,40,1,'%')}
   ${sld('pilotDisc','Pilot discount (Y1 only)',0,40,1,'%')}
 </div></div>

 <div class="grp"><h3>Cost knobs <span>▾</span></h3><div>
   ${sld('salMult','Salary level vs plan',60,160,5,'%')}
   ${sld('opexMult','Non-salary opex vs plan',60,160,5,'%')}
   ${sld('cloudPerStudent','Cloud + infra per student',5,80,1,' ₹/yr')}
   ${sld('contingency','Contingency on opex',0,15,1,'%')}
 </div></div>

 <div class="grp"><h3>Finance <span>▾</span></h3><div>
   ${sld('tax','Corporate tax rate',0,40,1,'%')}
   ${sld('daPct','D&amp;A as % of tech infra',0,20,1,'%')}
   ${sld('ramp','In-year revenue ramp (0=flat)',0,1.5,.1,'')}
   ${num('seed','Opening cash / seed (₹ lakhs)')}
   <div class="fld"><label>Carry forward losses for tax</label>
   <select data-k="carryFwd"><option value="1">Yes (recommended)</option><option value="0">No</option></select></div>
 </div></div>

 <div class="grp"><h3>Valuation <span>▾</span></h3><div>
   ${sld('mult','ARR multiple (headline)',4,25,.5,'x')}
   ${num('seedPre','Seed pre-money (₹ lakhs)')}
   ${num('aAmt','Series A raise (₹ lakhs)')}
   ${num('aPre','Series A pre-money (₹ lakhs)')}
   ${num('bAmt','Series B raise (₹ lakhs)')}
   ${num('bPre','Series B pre-money (₹ lakhs)')}

function chartStacked(labels,series,fmt){
 const W=820,H=300,P={l:62,r:12,t:14,b:34};
 const tot=labels.map((_,i)=>series.reduce((a,s)=>a+Math.max(0,s.data[i]),0));
 const mx=Math.max(1,...tot)*1.12;
 const iw=W-P.l-P.r, ih=H-P.t-P.b, bw=iw/labels.length*0.62;
 let g='';
 for(let k=0;k<=4;k++){const y=P.t+ih-ih*k/4;
   g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#22395e" stroke-width="1"/>
       <text x="${P.l-7}" y="${y+4}" fill="#90A4C4" font-size="10.5" text-anchor="end">${fmt(mx*k/4)}</text>`;}
 labels.forEach((lb,i)=>{
   const cx=P.l+iw*(i+.5)/labels.length; let acc=0;
   series.forEach(s=>{const v=Math.max(0,s.data[i]);const h=ih*v/mx;
     if(h>0.4)g+=`<rect x="${cx-bw/2}" y="${P.t+ih-acc-h}" width="${bw}" height="${h}" fill="${s.c}"><title>${s.n}: ${fmt(v)}</title></rect>`;
     acc+=h;});
   g+=`<text x="${cx}" y="${P.t+ih-acc-7}" fill="#E8EEF7" font-size="11" font-weight="600" text-anchor="middle">${fmt(tot[i])}</text>`;
   g+=`<text x="${cx}" y="${H-11}" fill="#90A4C4" font-size="11" text-anchor="middle">${lb}</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="lg">`+
  series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')+`</div>`;
}
function chartLine(labels,series,fmt,zero){
 const W=820,H=290,P={l:62,r:12,t:14,b:34};
 const all=series.flatMap(s=>s.data);
 let mx=Math.max(...all),mn=Math.min(0,...all);
 if(mx===mn)mx=mn+1; const pad=(mx-mn)*0.12; mx+=pad; mn-=pad;
 const iw=W-P.l-P.r,ih=H-P.t-P.b;
 const X=i=>P.l+iw*(labels.length===1?.5:i/(labels.length-1));
 const Y=v=>P.t+ih-ih*(v-mn)/(mx-mn);
 let g='';
 for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);
   g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#22395e"/>
       <text x="${P.l-7}" y="${y+4}" fill="#90A4C4" font-size="10.5" text-anchor="end">${fmt(v)}</text>`;}
 if(zero&&mn<0)g+=`<line x1="${P.l}" y1="${Y(0)}" x2="${W-P.r}" y2="${Y(0)}" stroke="#7d8da8" stroke-dasharray="4 3"/>`;
 series.forEach(s=>{
   const d=s.data.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ');
   if(s.area)g+=`<path d="${d} L ${X(s.data.length-1)} ${Y(Math.max(mn,0))} L ${X(0)} ${Y(Math.max(mn,0))} Z" fill="${s.c}" opacity=".13"/>`;
   g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.4"/>`;
   s.data.forEach((v,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.6" fill="${s.c}"><title>${s.n} ${labels[i]}: ${fmt(v)}</title></circle>`;});
 });
 labels.forEach((lb,i)=>{if(labels.length<=12||i%6===0)
   g+=`<text x="${X(i)}" y="${H-11}" fill="#90A4C4" font-size="10.5" text-anchor="middle">${lb}</text>`;});
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="lg">`+
   series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')+`</div>`;
}
function heatColor(t){ // 0..1 -> red->amber->green
 const r=t<.5?255:Math.round(255-(t-.5)*2*200);
 const g=t<.5?Math.round(80+t*2*175):255-Math.round((t-.5)*2*40);
 return `rgba(${r},${g},110,${.18+t*.45})`;
}

function renderSens(){
 // heatmap: SEREN price multiplier x new-institute multiplier -> chosen metric
 const metric=window.__hmMetric||'rev5';
 const pm=[.6,.8,.9,1,1.1,1.25,1.5], im=[.5,.75,1,1.25,1.5,2];
 const grid=pm.map(p=>im.map(i=>{
   const r=compute(S,{inst:SCEN_DEF[SCEN].inst*i,spi:SCEN_DEF[SCEN].spi,price:SCEN_DEF[SCEN].price*p,
     adopt:SCEN_DEF[SCEN].adopt,cost:SCEN_DEF[SCEN].cost});
   return metric==='rev5'?r.rev[4]/100:metric==='ebitda5'?r.ebitda[4]/100:metric==='be'?(r.beOp||99):r.minBal;
 }));
 const flat=grid.flat(), lo=Math.min(...flat), hi=Math.max(...flat);
 const inv=(metric==='be');
 const fmtv=v=>metric==='be'?(v>=99?'—':'M'+Math.round(v)):nf(v,metric==='minBal'?0:1);
 let hm=`<div class="tw"><table class="hm"><thead><tr><th>SEREN price ↓ / new institutes →</th>`+
   im.map(i=>`<th>${Math.round(i*100)}%</th>`).join('')+`</tr></thead><tbody>`;
 pm.forEach((p,r)=>{hm+=`<tr><td>${Math.round(p*100)}% (₹${Math.round(S.sPrice[0]*p)} Y1)</td>`+
   grid[r].map(v=>{let t=(v-lo)/((hi-lo)||1); if(inv)t=1-t;
     return `<td style="background:${heatColor(t)}">${fmtv(v)}</td>`;}).join('')+`</tr>`;});
 hm+='</tbody></table></div>';

 // tornado on Y5 EBITDA
 const base=compute(S,SCEN_DEF[SCEN]).ebitda[4];
 const drivers=[
  ['New institutes signed',s=>s.newInst=s.newInst.map(v=>v*1.2),s=>s.newInst=s.newInst.map(v=>v*.8)],
  ['Students per institute',s=>s.spi=s.spi.map(v=>v*1.2),s=>s.spi=s.spi.map(v=>v*.8)],
  ['SEREN price',s=>s.sPrice=s.sPrice.map(v=>v*1.2),s=>s.sPrice=s.sPrice.map(v=>v*.8)],
  ['MERIDIAN adoption',s=>s.mAdopt=s.mAdopt.map(v=>v*1.2),s=>s.mAdopt=s.mAdopt.map(v=>v*.8)],
  ['MERIDIAN price',s=>s.mPrice=s.mPrice.map(v=>v*1.2),s=>s.mPrice=s.mPrice.map(v=>v*.8)],
  ['Institute churn rate',s=>s.churn=s.churn*1.5,s=>s.churn=s.churn*.5],
  ['Salary level',s=>s.salMult=s.salMult*1.2,s=>s.salMult=s.salMult*.8],
  ['Cloud cost per student',s=>s.cloudPerStudent*=2,s=>s.cloudPerStudent*=.5],
  ['PRISM certification adoption',s=>s.cAdopt=s.cAdopt.map(v=>v*1.2),s=>s.cAdopt=s.cAdopt.map(v=>v*.8)],
  ['Bulk discount depth',s=>s.bulkDisc=s.bulkDisc*1.5,s=>s.bulkDisc=s.bulkDisc*.5]
 ].map(([n,up,dn])=>{
   const a=JSON.parse(JSON.stringify(S));up(a);
   const b=JSON.parse(JSON.stringify(S));dn(b);
   const hiV=compute(a,SCEN_DEF[SCEN]).ebitda[4], loV=compute(b,SCEN_DEF[SCEN]).ebitda[4];
   return {n,hi:hiV-base,lo:loV-base,span:Math.abs(hiV-loV)};
 }).sort((x,y)=>y.span-x.span);
 const mx=Math.max(...drivers.map(d=>Math.max(Math.abs(d.hi),Math.abs(d.lo))))||1;
 const W=820,rh=28,H=drivers.length*rh+26,mid=W*.56;
 let tg='';
 drivers.forEach((d,i)=>{const y=i*rh+9;
  const wH=Math.abs(d.hi)/mx*(W-mid-16), wL=Math.abs(d.lo)/mx*(mid-250);
  tg+=`<text x="4" y="${y+15}" fill="#90A4C4" font-size="11.5">${d.n}</text>`;
  tg+=`<rect x="${d.lo<0?mid-wL:mid}" y="${y+3}" width="${wL}" height="15" fill="${d.lo<0?'#FF6B6B':'#2FA37A'}" opacity=".85"><title>−20%: ₹${nf(d.lo)} L</title></rect>`;
  tg+=`<rect x="${d.hi<0?mid-wH:mid}" y="${y+3}" width="${wH}" height="15" fill="${d.hi<0?'#FF6B6B':'#2FA37A'}" opacity=".85"><title>+20%: ₹${nf(d.hi)} L</title></rect>`;
  tg+=`<text x="${W-6}" y="${y+15}" fill="#E8EEF7" font-size="11" text-anchor="end">±₹${nf(d.span/2,0)} L</text>`;});
 tg+=`<line x1="${mid}" y1="0" x2="${mid}" y2="${H-20}" stroke="#90A4C4" stroke-dasharray="4 3"/>`;

 document.getElementById('t-sens').innerHTML=`
 <h2>Two-way sensitivity</h2>
 <p class="note">Price and growth are the two levers an institute actually negotiates with you. Green is better; the grid recomputes the full 5-year model ${pm.length*im.length} times every time you touch an input.</p>
 <div class="row" style="margin-bottom:10px">
  ${[['rev5','Year-5 revenue (₹ Cr)'],['ebitda5','Year-5 EBITDA (₹ Cr)'],['be','Break-even month'],['minBal','Lowest cash (₹ L)']]
   .map(([k,n])=>`<button class="btn ${metric===k?'on':''}" onclick="window.__hmMetric='${k}';render()">${n}</button>`).join('')}
 </div>
 ${hm}
 <h2>What actually moves Year-5 EBITDA (±20% on each driver)</h2>
 <p class="note">The longest bar is the assumption to spend your diligence on. If a driver barely moves the bar, stop arguing about it in board meetings.</p>
 <div class="card"><svg viewBox="0 0 ${W} ${H}">${tg}</svg></div>`;
}

 <tr><td style="text-align:left"><b>4. LTV on gross revenue</b></td><td style="text-align:left">LTV is built from ACV without applying gross margin, inflating LTV:CAC.</td><td style="text-align:left">LTV = ACV × gross margin × retention sum — the convention a VC will use.</td></tr>
 <tr><td style="text-align:left"><b>5. No loss carry-forward</b></td><td style="text-align:left">Year-1 loss is ignored for tax purposes in later years.</td><td style="text-align:left">Losses carry forward by default (toggle in the sidebar).</td></tr>
 </tbody></table></div>
 <div class="ok"><b>Market context sheet is unchanged:</b> AISHE 4.5 Cr enrolled students, 64,756 HEIs, 8,293 NAAC-accredited — but keep TAM honest. At ₹1,000–2,000 per student, a ₹2 lakh crore TAM implies near-total national penetration at full price. A serviceable obtainable market built bottom-up from NAAC-accredited private institutes in three target states is far more credible in a pitch than a top-down figure.</div>`;
}

document.addEventListener('input',e=>{
 const t=e.target; if(!t.dataset||!t.dataset.k)return;
 const k=t.dataset.k, v=parseFloat(t.value);
 const focus={k:k,i:t.dataset.i,sel:t.selectionStart,tag:t.tagName};
 if(t.dataset.i!==undefined){ if(isNaN(v))return; S[k][+t.dataset.i]=v; }
 else { if(t.tagName==='SELECT'){S[k]=+t.value;} else {if(isNaN(v))return;S[k]=v;} }
 render();
 const sel='[data-k="'+focus.k+'"]'+(focus.i!==undefined?'[data-i="'+focus.i+'"]':'');
 const el=document.querySelector(sel.replace('[data-i="undefined"]',''));
 if(el&&el.focus){el.focus();try{el.setSelectionRange(focus.sel,focus.sel);}catch(_){}}
});
