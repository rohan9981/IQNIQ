<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f9;--surface:#ffffff;--text:#16192b;--muted:#5d6580;--line:#dde1ec;
  --accent:#3b3fd8;--accent-soft:#e6e7fb;--good:#14804a;--bad:#c23a3a;--warn:#b7791f;
  --good-rgb:20,128,74;--bad-rgb:194,58,58;
  color-scheme:light;

}

}
:root[data-theme="dark"]{--bg:#0f1220;--surface:#181c31;--text:#e9ebf6;--muted:#9aa1be;--line:#2a2f4b;--accent:#8c90ff;--accent-soft:#25294d;--good:#4cc38a;--bad:#ff7a7a;--warn:#e5b04f;--good-rgb:76,195,138;--bad-rgb:255,122,122;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);background:var(--surface)}

.btns{display:flex;gap:8px;flex-wrap:wrap}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{display:block;color:var(--muted);font-size:13px}

th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}

.tog{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.inst{display:grid;grid-template-columns:1fr 84px 70px;gap:6px;margin-bottom:8px;align-items:center;font-size:13px}
.inst input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.hd{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;padding:0 clamp(16px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 14px;color:var(--muted);white-space:nowrap}
.tabs button.act{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px}
.stack div{height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
td.why{white-space:normal;text-align:left;min-width:260px;color:var(--muted)}
tr.tot td{font-weight:600;background:var(--bg)}
.warn{color:var(--warn);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useMemo,useEffect}=React;const h=React.createElement;
const KEY="revmodel:v1";
const DEFAULTS={
  inst:[{n:"Institute A",s:2000},{n:"Institute B",s:1800},{n:"Institute C",s:1200}],
  sp:1500,fp:1000,ratio:20,adopt:100,disc:0,cost:12000000,costInf:6,priceInf:5,fixedGrow:10,
  newY2:5,newY3:7,churn:5,studG:5,
  split:[38,14,10,12,14,5,7],
  fixedPct:[90,60,30,20,50,80,80],
  runway:24,collect:50,buffer:15,dil:20,exitYr:5,exitMult:4.5,targetX:20,futDil:30,discRate:30,signed:0,arrMult:5,
};
const inr=n=>{const a=Math.abs(n),s=n<0?"-":"";
  if(a>=1e7)return s+"₹"+(a/1e7).toFixed(2)+" Cr";
  if(a>=1e5)return s+"₹"+(a/1e5).toFixed(1)+" L";
  return s+"₹"+Math.round(a).toLocaleString("en-IN")};
const num=n=>Math.round(n).toLocaleString("en-IN");

const CATS=[
  {n:"Engineering and AI team",d:"Product, backend, front end and ML engineers building the four modules and AI insights",c:"#3b3fd8"},
  {n:"Psychologists and content",d:"Advisor retainers, assessment design and validation, licensing of established scales",c:"#7a5bd6"},
  {n:"Cloud and security",d:"Hosting, data protection, security audits and backups",c:"#0f9aa8"},
  {n:"Onboarding and support",d:"Implementation, training and helpdesk for each institute",c:"#e08a1e"},
  {n:"Sales and marketing",d:"Pilot outreach, travel, events and demos for deans and directors",c:"#d1495b"},
  {n:"Legal and compliance",d:"DPDP Act consent framework, contracts and privacy reviews",c:"#5a9a3c"},
  {n:"Admin and contingency",d:"Accounting, tools, office and a buffer for overruns",c:"#8a8fa8"}
];
// core revenue formula
function annual(students,p,x){
  const paying=students*x.adopt/100;
  const faculty=students/x.ratio;
  const sRev=paying*p*(1-x.disc/100);
  const fRev=faculty*x.fp*(1-x.disc/100);
  return{paying,faculty,sRev,fRev,rev:sRev+fRev};
}
function load(){try{const v=localStorage.getItem(KEY);if(v)return Object.assign({},DEFAULTS,JSON.parse(v))}catch(e){}return DEFAULTS}

function Num({label,k,x,set,step}){
  return h("div",{className:"field"},h("label",{htmlFor:k},label),
    h("input",{id:k,type:"number",value:x[k],step:step||1,onChange:e=>set({...x,[k]:parseFloat(e.target.value)||0})}));
}
function heat(v,max){
  const t=Math.min(1,Math.abs(v)/(max||1))*0.55+0.08;
  return v>=0?`rgba(var(--good-rgb),${t})`:`rgba(var(--bad-rgb),${t})`;
}
function Grid({title,desc,rowLabel,rows,cols,colLabel,fn,baseR,baseC,mode,fmtRow,fmtCol}){
  const vals=rows.map(r=>cols.map(c=>fn(r,c)));
  const max=Math.max(...vals.flat().map(Math.abs));
  return h("section",null,h("h2",null,title),h("p",null,desc),
    h("div",{className:"scroll"},h("table",null,
      h("thead",null,h("tr",null,h("th",null,rowLabel+" ↓  /  "+colLabel+" →"),cols.map((c,i)=>h("th",{key:i},fmtCol(c))))),
      h("tbody",null,rows.map((r,i)=>h("tr",{key:i},h("td",null,fmtRow(r)),
        vals[i].map((v,j)=>h("td",{key:j,className:"cell"+(r===baseR&&cols[j]===baseC?" base":""),style:{background:mode==="profit"?heat(v,max):undefined}},inr(v))))))
    )));
}

// multi-year projection: price escalation on revenue, inflation on cost, fixed vs variable split
function project(x,total,N){
  const avg=total/Math.max(1,x.inst.length);
  const sum=x.split.reduce((a,b)=>a+b,0)||1;
  const fb=CATS.reduce((a,_,i)=>a+x.cost*x.split[i]/sum*x.fixedPct[i]/100,0);
  const vb=x.cost-fb;
  let n=x.inst.length;const out=[];
  for(let y=1;y<=N;y++){
    if(y>=2)n=n*(1-x.churn/100)+(y===2?x.newY2:x.newY3);
    const s=n*avg*Math.pow(1+x.studG/100,y-1);
    const pf=Math.pow(1+x.priceInf/100,y-1),cf=Math.pow(1+x.costInf/100,y-1);
    const r=annual(s,x.sp*pf,{...x,fp:x.fp*pf});
    const fixed=fb*cf*Math.pow(1+x.fixedGrow/100,y-1);
    const variable=vb*(total?s/total:0)*cf;
    const cost=fixed+variable,p=r.rev-cost;
    out.push({y,n,s,price:x.sp*pf,rev:r.rev,fixed,variable,cost,p,margin:r.rev?p/r.rev*100:0,cm:r.rev?(r.rev-variable)/r.rev*100:0});
  }
  return out;
}
function InflationView({x,total}){
  const N=5,rows=project(x,total,N);
  const cum=rows.reduce((a,r)=>a+r.p,0);
  const be=rows.find(r=>r.p>=0);
  const last=rows[N-1];
  const line=(label,f,cls)=>h("tr",null,h("td",null,label),rows.map(r=>h("td",{key:r.y,className:cls?cls(r):""},f(r))));
  const cis=[-4,-2,0,2,4].map(d=>x.costInf+d).filter(v=>v>=0);
  const pis=[-5,-2.5,0,2.5,5].map(d=>x.priceInf+d).filter(v=>v>=0);
  const m5=(ci,pi)=>project({...x,costInf:ci,priceInf:pi},total,N)[N-1].margin;
  const grid=cis.map(c=>pis.map(p=>m5(c,p)));
  const mx=Math.max(...grid.flat().map(Math.abs));
  const pc=v=>v.toFixed(1)+"%";
  return h("main",null,
    h("div",{className:"kpis"},
      h("div",{className:"kpi"},h("span",null,"Year 5 revenue"),h("div",{className:"big"},inr(last.rev)),h("small",null,"Price per student "+inr(last.price))),
      h("div",{className:"kpi"},h("span",null,"Year 5 profit margin"),h("div",{className:"big "+(last.margin>=0?"pos":"neg")},pc(last.margin)),h("small",null,"Year 1: "+pc(rows[0].margin))),
      h("div",{className:"kpi"},h("span",null,"First profitable year"),h("div",{className:"big"},be?"Year "+be.y:"Beyond Year "+N),h("small",null,"Annual profit at or above zero")),
      h("div",{className:"kpi"},h("span",null,"Cumulative profit, "+N+" years"),h("div",{className:"big "+(cum>=0?"pos":"neg")},inr(cum)),h("small",null,"Nominal rupees"))),
    h("section",null,h("h2",null,"Five-year view with inflation"),
      h("p",null,"Prices rise by "+x.priceInf+"% a year and costs by "+x.costInf+"% a year. Fixed costs also step up by "+x.fixedGrow+"% a year for hiring. Variable costs scale with student numbers. Change these in the Costs and growth panel."),
      h("div",{className:"scroll"},h("table",null,
        h("thead",null,h("tr",null,h("th",null,""),rows.map(r=>h("th",{key:r.y},"Year "+r.y)))),
        h("tbody",null,
          line("Institutes",r=>r.n.toFixed(1)),
          line("Students",r=>num(r.s)),
          line("Price per student",r=>inr(r.price)),
          line("Revenue",r=>inr(r.rev)),
          line("Fixed cost",r=>inr(r.fixed)),
          line("Variable cost",r=>inr(r.variable)),
          line("Total cost",r=>inr(r.cost)),
          line("Profit or gap",r=>inr(r.p),r=>r.p>=0?"pos":"neg"),
          line("Contribution margin",r=>pc(r.cm)),
          line("Profit margin",r=>pc(r.margin),r=>r.margin>=0?"pos":"neg"))))),
    h("section",null,h("h2",null,"Year 5 profit margin: cost inflation vs price escalation"),
      h("p",null,"If costs rise faster than the prices you can charge, margins shrink. Rows are cost inflation, columns are price escalation. The outlined cell is your current setting."),
      h("div",{className:"scroll"},h("table",null,
        h("thead",null,h("tr",null,h("th",null,"Cost inflation ↓  /  Price escalation →"),pis.map((p,i)=>h("th",{key:i},p+"%")))),
        h("tbody",null,cis.map((c,i)=>h("tr",{key:i},h("td",null,c+"%"),
          grid[i].map((v,j)=>h("td",{key:j,className:"cell"+(c===x.costInf&&pis[j]===x.priceInf?" base":""),style:{background:heat(v,mx)}},pc(v)))))))),
      h("p",{className:"note"},"Price escalation only holds if your contracts allow it, so consider an annual escalation clause in institute agreements. Contribution margin is revenue minus variable cost, before fixed costs.")));
}
function ValuationView({x,set,total}){
  const R=Math.max(1,x.runway),ny=Math.ceil(R/12),pr=project(x,total,ny);
  let gross=0,net=0;
  pr.forEach((r,i)=>{const m=Math.min(12,R-12*i);if(m>0){gross+=r.cost*m/12;net+=(r.cost-r.rev*x.collect/100)*m/12}});
  const buf=1+x.buffer/100,raiseG=gross*buf,raiseN=Math.max(0,net)*buf;
  const d=x.dil/100,post=v=>d>0?v/d:0;
  const yrs=Math.max(1,Math.round(x.exitYr)),ex=project(x,total,yrs),last=ex[ex.length-1];
  const exitVal=last.rev*x.exitMult,keep=Math.max(0.01,1-x.futDil/100);
  const vcPost=x.targetX>0?exitVal*keep/x.targetX:0;
  const reqExit=post(raiseN)*x.targetX/keep,reqRev=x.exitMult>0?reqExit/x.exitMult:0,gap=last.rev?reqRev/last.rev:0;
  const mults=[0.5,0.75,1,1.25,1.5],dils=[10,15,20,25,30];
  const tx=[10,15,20,30],ms=[3,4.5,6,8,12];
  const dr=x.discRate/100,dcf=(r,m)=>{const q=r/100;let pv=0;ex.forEach(o=>{pv+=o.p/Math.pow(1+q,o.y)});return pv+last.rev*m/Math.pow(1+q,yrs)};
  const dcfV=dcf(x.discRate,x.exitMult),pvFlows=ex.reduce((a,o)=>a+o.p/Math.pow(1+dr,o.y),0),pvTV=last.rev*x.exitMult/Math.pow(1+dr,yrs);
  const instRev=x.inst.map(o=>annual(o.s,x.sp,x).rev),cum=k=>instRev.slice(0,k).reduce((a,b)=>a+b,0);
  const sg=Math.max(0,Math.min(x.inst.length,Math.round(x.signed))),arr=cum(sg),arrV=arr*x.arrMult;
  const F=(l,k,s)=>h(Num,{label:l,k,x,set,step:s});
  return h('main',null,
    h('div',{className:'kpis'},
      h('div',{className:'kpi'},h('span',null,'Amount to raise'),h('div',{className:'big'},inr(raiseN)),h('small',null,'Over '+R+' months, net of '+x.collect+'% revenue collected')),
      h('div',{className:'kpi'},h('span',null,'Post-money, funding need'),h('div',{className:'big'},inr(post(raiseN))),h('small',null,'At '+x.dil+'% dilution')),
      h('div',{className:'kpi'},h('span',null,'Post-money, VC method'),h('div',{className:'big'},inr(vcPost)),h('small',null,'Year '+yrs+' revenue '+inr(last.rev))),
      h('div',{className:'kpi'},h('span',null,'Exit needed to justify funding-need value'),h('div',{className:'big '+(gap<=1?'pos':'neg')},inr(reqExit)),h('small',null,gap.toFixed(1)+'x your projected Year '+yrs+' revenue'))),
    h('div',{className:'panel',style:{marginBottom:24}},h('h2',null,'Valuation assumptions'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',columnGap:24}},
        F('Runway to fund (months)','runway'),F('Revenue collected in runway (%)','collect',5),F('Buffer on raise (%)','buffer',5),F('Dilution this round (%)','dil',1),
        F('Exit year','exitYr'),F('Exit revenue multiple (x)','exitMult',0.5),F('Investor target return (x)','targetX',1),F('Further dilution before exit (%)','futDil',5),F('Discount rate, DCF (%)','discRate',1),F('Institutes with signed contracts','signed'),F('ARR multiple (x)','arrMult',0.5))),
    h('section',null,h('h2',null,'1. Funding-need method'),
      h('p',null,'Costs and revenue come from the inflation model for the runway period. Raise = net cash need plus buffer. Post-money = raise divided by the share you give up.'),
      h('div',{className:'scroll'},h('table',null,
        h('thead',null,h('tr',null,h('th',null,'Basis'),h('th',null,'Raise'),h('th',null,'Post-money'),h('th',null,'Pre-money'))),
        h('tbody',null,[['Net of collected revenue',raiseN],['Gross burn, no revenue',raiseG]].map((o,i)=>h('tr',{key:i},h('td',null,o[0]),h('td',null,inr(o[1])),h('td',null,inr(post(o[1]))),h('td',null,inr(post(o[1])-o[1]))))))),
      h('p',{className:'note'},'Colleges often pay annually and pilots are discounted, so keep the collected share conservative.')),
    h('section',null,h('h2',null,'Post-money value: raise size vs dilution'),
      h('p',null,'Rows scale the net raise. Columns are the equity given up. The outlined cell is your current setting.'),
      h('div',{className:'scroll'},h('table',null,
        h('thead',null,h('tr',null,h('th',null,'Raise ↓  /  Dilution →'),dils.map((v,i)=>h('th',{key:i},v+'%')))),
        h('tbody',null,mults.map((m,i)=>h('tr',{key:i},h('td',null,inr(raiseN*m)),dils.map((v,j)=>h('td',{key:j,className:'cell'+(m===1&&v===x.dil?' base':'')},inr(raiseN*m/(v/100)))))))))),
    h('section',null,h('h2',null,'2. VC method'),
      h('p',null,'Works back from an exit. Post-money = exit value × share kept after later rounds ÷ the return the investor needs.'),
      h('div',{className:'scroll'},h('table',null,
        h('tbody',null,[['Exit-year revenue (Year '+yrs+')',inr(last.rev)],['Exit multiple',x.exitMult+'x'],['Exit value',inr(exitVal)],['Share kept after later rounds',(keep*100).toFixed(0)+'%'],['Investor target return',x.targetX+'x'],['Implied post-money today',inr(vcPost)],['Implied pre-money today',inr(vcPost-raiseN)]].map((o,i)=>h('tr',{key:i,className:i===5?'tot':''},h('td',null,o[0]),h('td',null,o[1])))))),
      h('p',{className:'note'},'Compare this with the funding-need value. If the VC method gives a lower figure, investors will push your valuation down or ask for a bigger outcome.')),
    h('section',null,h('h2',null,'VC method post-money: exit multiple vs target return'),
      h('p',null,'Uses your Year '+yrs+' revenue of '+inr(last.rev)+' and '+x.futDil+'% further dilution.'),
      h('div',{className:'scroll'},h('table',null,
        h('thead',null,h('tr',null,h('th',null,'Target return ↓  /  Exit multiple →'),ms.map((v,i)=>h('th',{key:i},v+'x')))),
        h('tbody',null,tx.map((t,i)=>h('tr',{key:i},h('td',null,t+'x'),ms.map((m,j)=>h('td',{key:j,className:'cell'+(t===x.targetX&&m===x.exitMult?' base':'')},inr(last.rev*m*keep/t))))))))),
    h('section',null,h('h2',null,'3. Discounted cash flow (DCF)'),
      h('p',null,'Discounts your projected yearly profit (a stand-in for free cash flow, before tax and capex) at '+x.discRate+'%, plus a terminal value of exit-year revenue × '+x.exitMult+'x. Early-stage rates are high because the risk is high.'),
      h('div',{className:'scroll'},h('table',null,
        h('thead',null,h('tr',null,h('th',null,'Year'),h('th',null,'Profit or gap'),h('th',null,'Discount factor'),h('th',null,'Present value'))),
        h('tbody',null,ex.map(o=>h('tr',{key:o.y},h('td',null,'Year '+o.y),h('td',{className:o.p>=0?'pos':'neg'},inr(o.p)),h('td',null,(1/Math.pow(1+dr,o.y)).toFixed(3)),h('td',null,inr(o.p/Math.pow(1+dr,o.y))))).concat([
          h('tr',{key:'a'},h('td',null,'PV of yearly cash flows'),h('td',null,''),h('td',null,''),h('td',null,inr(pvFlows))),
